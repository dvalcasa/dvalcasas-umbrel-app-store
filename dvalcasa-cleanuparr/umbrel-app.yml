version: "1.0.1"
port: 11011
description: >-
  Cleanuparr is an advanced download manager for the Servarr ecosystem. 
  It works with Sonarr, Radarr, Lidarr, Readarr, and Whisparr alongside download clients like qBittorrent, Transmission, and Deluge. 
  Beyond cleaning up stalled, blocked, and malicious downloads, it searches for missing content and quality upgrades, manages seeding, and removes orphaned files.
