version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dvalcasa-gluetun_server_1
      APP_PORT: 8888

  server:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER
      - VPN_TYPE
      - WIREGUARD_PRIVATE_KEY
      - SERVER_COUNTRIES
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,10.21.0.0/16
      - UPDATER_PERIOD=24h
    ports:
      - 8094:8094 # qbitorrent Web UI
    restart: on-failure
