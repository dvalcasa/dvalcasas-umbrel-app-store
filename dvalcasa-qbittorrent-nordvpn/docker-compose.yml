version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dvalcasa-qbittorrent-nordvpn_gluetun_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"
      PROXY_AUTH_WHITELIST: "/api/*"

  gluetun:
    image: qmcgaw/gluetun:v3.41
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: ${APP_DATA_DIR}/data/vpn.env
        required: false
    ports:
      # Les ports des services qui utilisent gluetun sont publiés ici
      - 8080:8080   # exemple : interface web d'un client torrent
      - 6881:6881
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,10.21.0.0/16
      - FIREWALL_INPUT_PORTS=8080
      - UPDATER_PERIOD=24h
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
    restart: on-failure

  # Exemple de service routé via le VPN
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.3.0
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
