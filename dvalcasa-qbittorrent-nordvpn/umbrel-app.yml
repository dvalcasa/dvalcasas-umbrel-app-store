manifestVersion: 1.1
id: dvalcasa-qbittorrent-nordvpn
category: networking
name: qBittorrent + NordVPN
version: "3.2.0"
tagline: qBittorrent isolé derrière NordVPN (Gluetun)
icon: https://raw.githubusercontent.com/dvalcasa/dvalcasas-umbrel-app-store/refs/heads/master/dvalcasa-qbittorrent-nordvpn/assets/icon.png
description: >-
  qBittorrent dont tout le trafic passe par Gluetun (NordVPN, WireGuard/NordLynx).
  Si le VPN tombe, qBittorrent n'a plus d'accès réseau (kill switch).
  Le reste d'UmbrelOS n'est pas affecté.

  Ouvre le fichier .env dans Files -> Apps -> dvalcasa-qbittorrent-nordvpn
  puis colle le token : WIREGUARD_PRIVATE_KEY=token
  emfin redémarre l'app.
developer: dvalcasa
website: https://github.com/qdm12/gluetun
dependencies: []
repo: https://github.com/qdm12/gluetun
support: https://github.com/qdm12/gluetun/discussions
port: 8094
gallery:
  - https://raw.githubusercontent.com/dvalcasa/dvalcasas-umbrel-app-store/refs/heads/master/dvalcasa-qbittorrent-nordvpn/assets/1.jpg
  - https://raw.githubusercontent.com/dvalcasa/dvalcasas-umbrel-app-store/refs/heads/master/dvalcasa-qbittorrent-nordvpn/assets/2.jpg
  - https://raw.githubusercontent.com/dvalcasa/dvalcasas-umbrel-app-store/refs/heads/master/dvalcasa-qbittorrent-nordvpn/assets/3.jpg
path: ""
defaultUsername: "admin"
defaultPassword: "adminadmin"
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: ""
submitter: dvalcasa
submission: ""