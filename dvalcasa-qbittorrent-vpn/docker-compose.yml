version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dvalcasa-qbittorrent-vpn_setup_1
      APP_PORT: 8080

  # Crée une clé factice si aucune n'existe : le VPN reste inactif
  # (kill switch) tant que tu n'as pas configuré la vraie clé.
  init:
    image: busybox:1.36
    command: sh -c 'mkdir -p /s && [ -s /s/wireguard_private_key ] || echo AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= > /s/wireguard_private_key'
    volumes:
      - ${APP_DATA_DIR}/data/secrets:/s
    restart: "no"

  setup:
    image: python:3.12-alpine
    command: python -u /app/server.py
    volumes:
      - ${APP_DATA_DIR}/setup/server.py:/app/server.py:ro
      - ${APP_DATA_DIR}/data/secrets:/secrets
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure

  gluetun:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "8085:8085"
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: France
      SERVER_CATEGORIES: P2P
      FIREWALL_INPUT_PORTS: "8085"
      FIREWALL_OUTBOUND_SUBNETS: 10.21.0.0/16
      TZ: Europe/Paris
    volumes:
      - ${APP_DATA_DIR}/data/secrets:/run/secrets:ro
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
    restart: on-failure

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
      WEBUI_PORT: 8085
    volumes:
      - ${APP_DATA_DIR}/data/qbittorrent:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
