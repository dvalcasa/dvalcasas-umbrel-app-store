version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dvalcasa-qbittorrent-vpn_gluetun_1
      APP_PORT: 8094

  gluetun:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Les ports des services qui utilisent gluetun sont publiés ici
      - 8094:8094   # exemple : interface web d'un client torrent
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,10.21.0.0/16
      - FIREWALL_INPUT_PORTS=8094
      - UPDATER_PERIOD=24h
    restart: on-failure

  # Exemple de service routé via le VPN
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8094
    volumes:
      - ${APP_DATA_DIR}/data/qbittorrent:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure