id: dvalcasa-qbittorrent-vpn
category: networking
name: qBittorrent + NordVPN
version: "2.0.1"
tagline: qBittorrent isolé derrière un VPN NordVPN (Gluetun)
icon: https://raw.githubusercontent.com/dvalcasa/dvalcasas-umbrel-app-store/refs/heads/master/dvalcasa-qbittorrent-vpn/artifacts/icon.svg
description: >-
  qBittorrent dont tout le trafic passe par Gluetun (NordVPN, WireGuard/NordLynx).
  Si le VPN tombe, qBittorrent n'a plus d'accès réseau (kill switch).
  Le reste d'umbrelOS n'est pas affecté.


  Ouvre l'app et colle ton access token NordVPN : la clé NordLynx est
  récupérée et le VPN redémarré automatiquement.
