version: "3.7"

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - path: ${APP_DATA_DIR}/data/vpn.env
        required: false
    ports:
      # Les ports des services qui utilisent gluetun sont publiés ici
      - 9091:9091   # exemple : interface web d'un client torrent
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,10.21.0.0/16
      - FIREWALL_INPUT_PORTS=9091
      - UPDATER_PERIOD=24h
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun
    restart: on-failure

  transmission:
    image: linuxserver/transmission:4.1.4@sha256:5b3c27a96c8a37c878a525ebf377a32032c3a3acfe845ecaa7c3eb10b09c2caa
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    ports:
      - 51413:51413
      - 51413:51413/udp
    restart: on-failure

  widget-server:
    image: ghcr.io/getumbrel/umbrel-transmission-widget:v1.0.1@sha256:4f65b7fc1940fd7c6604a3f6180edbd163d4add06c6601f195f29105630d709e
    environment:
      - TRANSMISSION_URL=http://transmission_server_1
      - TRANSMISSION_PORT=9091
    restart: on-failure