services:
  app_proxy:
    environment:
      APP_HOST: dvalcasa-gluetun_server_1
      APP_PORT: 8888
      PROXY_AUTH_ADD: "true"
  
  server:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-"nordvpn"}
      - VPN_TYPE=${VPN_TYPE:-"wireguard"}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-""}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-""}
      - FIREWALL_INPUT_PORTS=8888
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,10.21.0.0/16
    ports:
      - 8888:8888
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
